name: Build & Push Docker Image

on:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  # ── Compute image tag & build metadata ───────────────────────────────────
  meta:
    name: Build metadata
    runs-on: ubuntu-22.04
    outputs:
      app_version: ${{ steps.info.outputs.app_version }}
      git_commit:  ${{ steps.info.outputs.git_commit }}
      build_time:  ${{ steps.info.outputs.build_time }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute metadata
        id: info
        run: |
          git_commit=$(git rev-parse --short HEAD)
          build_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            # Strip leading 'v' for SemVer tags (v1.2.3 → 1.2.3)
            app_version="${tag#v}"
          else
            app_version="dev"
          fi

          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "git_commit=${git_commit}"   >> "$GITHUB_OUTPUT"
          echo "build_time=${build_time}"   >> "$GITHUB_OUTPUT"

  # ── Build: single image, frontend embedded into the Go binary ───────────
  build:
    name: Build image
    needs: meta
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          base="ghcr.io/aldoexpert/mikrotik-wireguard"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            semver="${tag#v}"
            images="${base}:${semver},${base}:latest"
          elif [[ "${GITHUB_REF}" == refs/heads/main || "${GITHUB_REF}" == refs/heads/master ]]; then
            images="${base}:latest"
          else
            # PR: build but do NOT push
            images="${base}:pr-${{ github.event.pull_request.number }}"
          fi

          echo "images=${images}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.images }}
          build-args: |
            APP_VERSION=${{ needs.meta.outputs.app_version }}
            BUILD_TIME=${{ needs.meta.outputs.build_time }}
            GIT_COMMIT=${{ needs.meta.outputs.git_commit }}
          cache-from: type=gha,scope=app
          cache-to:   type=gha,scope=app,mode=max
