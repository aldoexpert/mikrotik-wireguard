services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    # Tag published by CI on every push to main/master: "latest" (or a
    # semver tag like "1.2.3" for a release build -- set APP_VERSION in
    # .env to pin one). "dev" is NOT published; it's only a local build-arg
    # label (see build.args below) for images you build yourself.
    image: ghcr.io/aldoexpert/mikrotik-wireguard:${APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8200}:8200"
    volumes:
      - ./data:/app/data
    environment:
      MTWG_PORT: "8200"
      MTWG_DB_PATH: /app/data
      MTWG_DISABLE_LOGIN: ${MTWG_DISABLE_LOGIN:-false}
      MTWG_JWT_SECRET: ${MTWG_JWT_SECRET:?set a long random MTWG_JWT_SECRET in .env}
      MTWG_CORS_ALLOWED_ORIGINS: ${MTWG_CORS_ALLOWED_ORIGINS:-*}
      MTWG_USERNAME: ${MTWG_USERNAME:-admin}
      MTWG_PASSWORD: ${MTWG_PASSWORD:-admin}
      MTWG_ENDPOINT_ADDRESS: ${MTWG_ENDPOINT_ADDRESS:-}
      MTWG_SERVER_INTERFACE_ADDRESSES: ${MTWG_SERVER_INTERFACE_ADDRESSES:-10.252.1.0/24}
      MTWG_SERVER_LISTEN_PORT: ${MTWG_SERVER_LISTEN_PORT:-51820}
      MTWG_SMTP_HOSTNAME: ${MTWG_SMTP_HOSTNAME:-}
      MTWG_SMTP_PORT: ${MTWG_SMTP_PORT:-25}
      MTWG_SMTP_USERNAME: ${MTWG_SMTP_USERNAME:-}
      MTWG_SMTP_PASSWORD: ${MTWG_SMTP_PASSWORD:-}
      MTWG_EMAIL_FROM_ADDRESS: ${MTWG_EMAIL_FROM_ADDRESS:-}
      MTWG_TELEGRAM_TOKEN: ${MTWG_TELEGRAM_TOKEN:-}
      MTWG_SUBNET_RANGES: ${MTWG_SUBNET_RANGES:-}
    # Local WireGuard device status (wgctrl) needs access to the host's
    # network namespace / netlink socket. Not required once this project's
    # next phase moves device management to Mikrotik RouterOS 7 over SSH.
    # Uncomment if you still rely on a local wg0 interface:
    # network_mode: host
    # cap_add:
    #   - NET_ADMIN
  